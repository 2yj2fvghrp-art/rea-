name: Design discussion
description: Resolve an REA architecture, provider, or contract question before implementation
title: "[Design] "
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Use this for a substantial provider, public/persisted contract, or
        authority-boundary decision. Keep one decision per discussion.

        Read the [contribution scope](https://github.com/morluto/rea/blob/main/CONTRIBUTING.md#contribution-scope).
        Scope and authority decisions must precede integration. Unresolved scope,
        side effects, or required verification block integration; record unknowns
        and split mixed proposals into independently assessable capabilities.

  - type: checkboxes
    id: before-submitting
    attributes:
      label: Before submitting
      options:
        - label: I searched the open and closed issues and pull requests for a related discussion.
          required: true
        - label: I read the contribution scope and understand that unresolved boundary questions block integration.
          required: true
        - label: I removed credentials, tokens, private paths, and sensitive target data.
          required: true

  - type: textarea
    id: decision
    attributes:
      label: Decision needed
      description: State the exact question maintainers need to resolve.
      placeholder: Should REA ... or ...?
    validations:
      required: true

  - type: textarea
    id: context-evidence
    attributes:
      label: Context and evidence
      description: Explain why the decision is needed now. Separate observed behavior, derived evidence, and inference.
    validations:
      required: true

  - type: textarea
    id: boundary-invariants
    attributes:
      label: Boundary and invariants
      description: >-
        Explain scope fit, the owning layer, provider/bridge boundary, target
        selection, and evidence invariants. Identify execution, injection, scripts,
        mutation, network contact, persistence, and any protection recovery, bypass,
        or attack automation, including upstream behavior. State authorization
        constraints and non-goals; mark unknowns explicitly.
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Options and tradeoffs
      description: Compare a small number of viable approaches, including platform, compatibility, safety, evidence, and maintenance costs.
    validations:
      required: true

  - type: textarea
    id: success-criteria
    attributes:
      label: Success criteria and open questions
      description: >-
        State what evidence would settle scope and authority questions, using
        self-owned or appropriately licensed samples. Identify relevant real
        CLI/MCP or provider verification, resource and cleanup checks, unavailable
        coverage, and unresolved questions that could change the choice.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Link relevant contracts, upstream provider documentation, tests, measurements, or prior discussions.
