name: DeepSeek Harness plugin compatibility

on:
  push:
    branches: [main]
    paths:
      - 'integrations/deepseek-harness/**'
      - '.github/workflows/dsh-bundle.yml'
  pull_request:
    branches: [main]
    paths:
      - 'integrations/deepseek-harness/**'
      - '.github/workflows/dsh-bundle.yml'
  workflow_dispatch:

concurrency:
  group: dsh-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Bundle contract and Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - run: node --test integrations/deepseek-harness/tests/*.test.mjs
      - run: node integrations/deepseek-harness/scripts/verify-package.mjs
      - name: Verify install artifact without build hooks
        working-directory: integrations/deepseek-harness
        run: |
          npm pack --dry-run --json > /tmp/rea-dsh-pack.json
          node -e 'const a=require("/tmp/rea-dsh-pack.json")[0].files.map(x=>x.path);for(const f of ["package.json","launcher.mjs","cordis.patch.yml","README.md","LICENSE"])if(!a.includes(f))throw Error("missing packed file: "+f)'

  native-harness:
    name: Latest upstream Harness + packaged REA MCP
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DSH_HOME: /tmp/rea-dsh-profile
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Install pinned prebuilt REA runtime for local bundle
        run: npm install --prefix integrations/deepseek-harness --ignore-scripts --no-audit --no-fund
      - name: Verify real MCP initialization and tool discovery
        run: node integrations/deepseek-harness/scripts/smoke-mcp.mjs
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          path: harness-upstream
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: harness-upstream/package.json
      - name: Build current upstream Harness
        working-directory: harness-upstream
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Install local source bundle in a real Harness profile
        working-directory: harness-upstream
        run: pnpm dsh plugin --profile web add "$GITHUB_WORKSPACE/integrations/deepseek-harness"
      - name: Verify native bundle composition
        working-directory: harness-upstream
        run: |
          pnpm dsh --profile web --dump-config > /tmp/rea-dsh-composition.txt
          grep -F 'dsh-rea-bundle' /tmp/rea-dsh-composition.txt
          grep -F 'id: rea-mcp' /tmp/rea-dsh-composition.txt
          grep -F 'ctx.reaLauncher.command' /tmp/rea-dsh-composition.txt
      - name: Report scope
        run: |
          echo 'Validated: build-free bundle, prebuilt REA MCP handshake, current upstream Harness composition.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Not validated: live DeepSeek API calls, paid providers, native Desktop installation, optional Ghidra/IDA.' >> "$GITHUB_STEP_SUMMARY"

  release-plugin:
    name: Publish standalone dsh-v plugin GitHub release
    needs: [contract, native-harness]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Check whether this plugin version is already published
        id: release-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="$(node -p 'require("./integrations/deepseek-harness/package.json").version')"
          tag="dsh-v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${tag}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Plugin release ${tag} already exists; increment the bundle version to publish again." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Package audited plugin sources without build hooks
        if: steps.release-version.outputs.exists == 'false'
        working-directory: integrations/deepseek-harness
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/release-artifacts"
          sha256sum "$GITHUB_WORKSPACE"/release-artifacts/*.tgz
      - name: Create versioned plugin GitHub release
        if: steps.release-version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" release-artifacts/*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "REA for DeepSeek Harness ${RELEASE_TAG}" \
            --notes-file integrations/deepseek-harness/RELEASE_NOTES.md
      - name: Summarize plugin distribution
        env:
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
        run: |
          echo "Standalone Harness plugin: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "The root REA npm/MCP Registry publication remains governed by release.yml." >> "$GITHUB_STEP_SUMMARY"
