name: REL one-time stabilization format
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rel-stabilize-format.yml"
permissions:
  contents: write
jobs:
  stabilize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rel/first-lab-foundations' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: rel/first-lab-foundations
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format and test latest branch state without force push
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin refs/heads/rel/first-lab-foundations
            git reset --hard FETCH_HEAD
            npm run format
            git diff --check
            node --test rel/lab-server.test.mjs
            git add -u
            if git diff --cached --quiet; then
              echo "Latest branch already meets pinned formatting rules"
              exit 0
            fi
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(rel): normalize visual lab and launcher with pinned formatter"
            if git push origin HEAD:refs/heads/rel/first-lab-foundations; then
              echo "Formatted latest REL branch without force push"
              exit 0
            fi
            sleep 3
          done
          echo "Could not safely publish due to concurrent writes; no force push attempted" >&2
          exit 1
