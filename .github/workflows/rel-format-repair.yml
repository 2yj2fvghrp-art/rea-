name: REL one-time formatting repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rel-format-repair.yml"

permissions:
  contents: write

jobs:
  format-once:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rel/first-lab-foundations' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: rel/first-lab-foundations
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run repository-pinned formatter (not an arbitrary external version)
        run: npm run format
      - name: Save exact formatting patch and changed-file inventory
        run: |
          git diff --check
          git diff --name-only | tee "$RUNNER_TEMP/rel-format-files.txt"
          git diff --binary > "$RUNNER_TEMP/rel-format.patch"
      - name: Upload reproducible formatting patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rel-format-repair-patch
          path: |
            ${{ runner.temp }}/rel-format.patch
            ${{ runner.temp }}/rel-format-files.txt
          if-no-files-found: error
          retention-days: 7
      - name: Commit formatting only to our REL development branch
        run: |
          git add -u
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(rel): apply pinned repository formatter"
          git push origin HEAD:refs/heads/rel/first-lab-foundations
