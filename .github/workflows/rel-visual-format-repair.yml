name: REL one-time visual-lab formatting
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rel-visual-format-repair.yml"

permissions:
  contents: write

jobs:
  format-visual:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rel/first-lab-foundations' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: rel/first-lab-foundations
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format and push the most recent branch state (never force)
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin refs/heads/rel/first-lab-foundations
            git reset --hard FETCH_HEAD
            ./node_modules/.bin/oxfmt experiments/rel-visual-lab/index.html
            git diff --check
            git add -- experiments/rel-visual-lab/index.html
            if git diff --cached --quiet; then
              echo "No formatting changes needed in latest branch"
              exit 0
            fi
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(rel): format current visual investigation lab"
            if git push origin HEAD:refs/heads/rel/first-lab-foundations; then
              echo "Formatted current branch without overwriting concurrent work"
              exit 0
            fi
            sleep 3
          done
          echo "Concurrent commits prevented a safe format push. No force-push attempted." >&2
          exit 1
