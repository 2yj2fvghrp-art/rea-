name: REL scoped Mac formatter
on:
  push:
    branches:
      - rel/first-lab-foundations
    paths:
      - .github/workflows/rel-mac-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: rel/first-lab-foundations
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      - name: Apply the checked-in repository formatter to Mac changes
        run: npx oxfmt rel.mjs rel/mac-doctor.mjs rel/mac-doctor.test.mjs
      - name: Commit only formatter changes
        run: |
          git diff --check
          git add -- rel.mjs rel/mac-doctor.mjs rel/mac-doctor.test.mjs
          if ! git diff --cached --quiet; then
            git -c user.name='REL CI formatter' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(rel): format Mac readiness code'
            git push origin HEAD:rel/first-lab-foundations
          fi
